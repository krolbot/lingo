services:
  lingo:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      LINGO_DB: /data/lingo.db
    ports:
      - "127.0.0.1:8790:8790"
      - "127.0.0.1:8791:8791" # Admin is inactive unless LINGO_ADMIN_PORT=8791 and LINGO_ADMIN_TOKEN are set.
    volumes:
      - lingo-data:/data

volumes:
  lingo-data:
