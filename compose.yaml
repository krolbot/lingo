services:
  lingo:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      LINGO_DB: /data/lingo.db
    networks:
      - caddy
    volumes:
      - lingo-data:/data

volumes:
  lingo-data:

networks:
  caddy:
    external: true
