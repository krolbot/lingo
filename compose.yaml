services:
  lingo:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      LINGO_DB: /data/lingo.db
      LINGO_LOCAL_MODEL_DIR: /models
      LINGO_LOCAL_MODEL: hy-mt2-7b
      LINGO_LOCAL_LLM_TIMEOUT_MS: "180000"
    mem_limit: 12g
    cpus: 16
    networks:
      - caddy
    volumes:
      - lingo-data:/data
      - lingo-models:/models

volumes:
  lingo-data:
  lingo-models:

networks:
  caddy:
    external: true
